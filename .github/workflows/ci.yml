name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    # System dependencies for Scapy
    - name: Install libpcap
      run: sudo apt-get update && sudo apt-get install -y libpcap-dev

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest mypy ruff pytest-mock

    - name: Run ruff linter
      working-directory: ./backend
      run: python -m ruff check app/ scripts/ tests/

    - name: Run mypy
      working-directory: ./backend
      run: mypy app/ --ignore-missing-imports

    - name: Run backend pytest
      working-directory: ./backend
      run: pytest tests/ -v

    - name: Run root integration tests
      run: python -m pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm install

    - name: Lint
      working-directory: ./frontend
      run: npm run lint

    - name: Typecheck
      working-directory: ./frontend
      run: npm run tsc

    - name: Run tests
      working-directory: ./frontend
      run: npm test -- --run

    - name: Build
      working-directory: ./frontend
      run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      # CI-only dummy values: static is fine here, they never leave this job.
      # JWT key is >=32 chars and avoids the backend's placeholder patterns.
      JWT_SECRET_KEY: ci-smoke-jwt-9f2b8c1d4e6a7b0c3d5e8f1a2b4c6d8e
      ADMIN_PASSWORD: ci-smoke-admin-pass
      # Must be valid JSON: compose passes this to a pydantic list[str] field.
      CORS_ORIGINS: '["http://localhost:21080"]'
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: false
        tags: statsea-backend:latest
        
    - name: Build Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: false
        tags: statsea-frontend:latest

    # Verifies the P0 fix: frontend shares backend's host network, so nginx's
    # proxy_pass to 127.0.0.1:21081 reaches the backend instead of its own loopback.
    - name: Smoke test API through nginx
      run: |
        set -e
        docker compose up -d
        echo "Waiting for http://localhost:21080/api/health ..."
        for i in $(seq 1 60); do
          if curl -fsS http://localhost:21080/api/health; then
            echo ""
            echo "Smoke test passed"
            exit 0
          fi
          echo "attempt $i/60 failed; retrying in 2s"
          sleep 2
        done
        echo "Smoke test FAILED: /api/health never returned 200"
        docker compose ps
        docker compose logs --no-color --tail=100
        exit 1

    - name: Tear down stack
      if: always()
      run: docker compose down -v
